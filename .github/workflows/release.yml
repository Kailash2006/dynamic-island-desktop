# Builds the Windows installer on GitHub and publishes it as a release, so
# installed copies update themselves. Runs when source.zip is uploaded to the
# repository (or from Actions → Release → Run workflow).
name: Release

on:
  push:
    branches: [main]
    paths: ['source.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded source
        shell: pwsh
        run: |
          if (Test-Path source.zip) {
            # Mirror the zip: clear everything except git data and workflows,
            # so files removed from the project disappear here too.
            Move-Item source.zip $env:RUNNER_TEMP/source.zip
            Get-ChildItem -Force | Where-Object { $_.Name -notin '.git', '.github' } | Remove-Item -Recurse -Force
            Expand-Archive -Path $env:RUNNER_TEMP/source.zip -DestinationPath . -Force
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Update source from source.zip"
              git push
            }
          }
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A release counts as done only when it has latest.yml, the file
      # installed copies read to find updates.
      - name: Check for an existing release
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          $assets = gh release view "v$version" --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) { "state=missing" >> $env:GITHUB_OUTPUT }
          elseif ($assets -contains 'latest.yml') { "state=complete" >> $env:GITHUB_OUTPUT }
          else { "state=incomplete" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the installer
        if: steps.version.outputs.state != 'complete'
        shell: pwsh
        run: |
          npm ci
          npx vite build
          npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish v${{ steps.version.outputs.version }}
        if: steps.version.outputs.state != 'complete'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $installer = Get-ChildItem release -Filter "*-Setup-$version.exe" | Select-Object -First 1
          $files = @($installer.FullName, "$($installer.FullName).blockmap", "release/latest.yml")
          if ("${{ steps.version.outputs.state }}" -eq 'incomplete') {
            gh release upload $tag @files --clobber
          } else {
            git ls-remote --exit-code --tags origin $tag *> $null
            if ($LASTEXITCODE -ne 0) {
              git tag $tag
              git push origin $tag
            }
            gh release create $tag @files --title $version --notes "Dynoland $version. Installed copies update automatically."
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Already released
        if: steps.version.outputs.state == 'complete'
        run: echo "v${{ steps.version.outputs.version }} is already released. Raise the version in package.json to publish an update."
